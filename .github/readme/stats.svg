<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" role="img" aria-label="6 agent runtimes · 300ms voice latency · 120k GPU particles · 100% local">
  <defs>
    <linearGradient id="statline" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </linearGradient>
    <style>
      .num   { font-family: 'Syne','Inter',sans-serif; font-weight: 800; font-size: 120px; letter-spacing: -3px; fill: #ffffff; }
      .unit  { font-size: 48px; fill: #ffffff; fill-opacity: 0.5; }
      .label { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 3px; fill: #ffffff; fill-opacity: 0.5; }
    </style>
  </defs>

  <rect width="1600" height="320" fill="#0a0708"/>
  <line x1="0" y1="0"   x2="1600" y2="0"   stroke="#ffffff" stroke-opacity="0.07"/>
  <line x1="0" y1="320" x2="1600" y2="320" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- 6 agent runtimes -->
  <g transform="translate(120 0)">
    <rect x="0" y="80" width="0" height="1" fill="url(#statline)">
      <animate attributeName="width" from="0" to="180" dur="1.4s" fill="freeze" begin="0s"/>
    </rect>
    <g class="num">
      <text x="0" y="200" visibility="visible">0<set attributeName="visibility" to="hidden" begin="0.4s"/></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.4s"/><set attributeName="visibility" to="hidden" begin="0.55s"/>1</text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.55s"/><set attributeName="visibility" to="hidden" begin="0.7s"/>2</text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.7s"/><set attributeName="visibility" to="hidden" begin="0.85s"/>3</text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.85s"/><set attributeName="visibility" to="hidden" begin="1.0s"/>4</text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.0s"/><set attributeName="visibility" to="hidden" begin="1.15s"/>5</text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.15s"/>6</text>
    </g>
    <text x="0" y="250" class="label">AGENT RUNTIMES</text>
  </g>

  <!-- 300ms voice latency -->
  <g transform="translate(500 0)">
    <rect x="0" y="80" width="0" height="1" fill="url(#statline)">
      <animate attributeName="width" from="0" to="260" dur="1.4s" fill="freeze" begin="0.15s"/>
    </rect>
    <g class="num">
      <text x="0" y="200" visibility="visible">000<tspan class="unit" dx="8">ms</tspan><set attributeName="visibility" to="hidden" begin="0.55s"/></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.55s"/><set attributeName="visibility" to="hidden" begin="0.75s"/>040<tspan class="unit" dx="8">ms</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.75s"/><set attributeName="visibility" to="hidden" begin="0.95s"/>120<tspan class="unit" dx="8">ms</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.95s"/><set attributeName="visibility" to="hidden" begin="1.15s"/>200<tspan class="unit" dx="8">ms</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.15s"/><set attributeName="visibility" to="hidden" begin="1.35s"/>270<tspan class="unit" dx="8">ms</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.35s"/>300<tspan class="unit" dx="8">ms</tspan></text>
    </g>
    <text x="0" y="250" class="label">VOICE LATENCY</text>
  </g>

  <!-- 120k particles -->
  <g transform="translate(900 0)">
    <rect x="0" y="80" width="0" height="1" fill="url(#statline)">
      <animate attributeName="width" from="0" to="240" dur="1.4s" fill="freeze" begin="0.3s"/>
    </rect>
    <g class="num">
      <text x="0" y="200" visibility="visible">000<tspan class="unit" dx="8">k</tspan><set attributeName="visibility" to="hidden" begin="0.7s"/></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.7s"/><set attributeName="visibility" to="hidden" begin="0.9s"/>020<tspan class="unit" dx="8">k</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.9s"/><set attributeName="visibility" to="hidden" begin="1.1s"/>060<tspan class="unit" dx="8">k</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.1s"/><set attributeName="visibility" to="hidden" begin="1.3s"/>090<tspan class="unit" dx="8">k</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.3s"/><set attributeName="visibility" to="hidden" begin="1.5s"/>110<tspan class="unit" dx="8">k</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.5s"/>120<tspan class="unit" dx="8">k</tspan></text>
    </g>
    <text x="0" y="250" class="label">GPU PARTICLES</text>
  </g>

  <!-- 100% local -->
  <g transform="translate(1280 0)">
    <rect x="0" y="80" width="0" height="1" fill="url(#statline)">
      <animate attributeName="width" from="0" to="220" dur="1.4s" fill="freeze" begin="0.45s"/>
    </rect>
    <g class="num">
      <text x="0" y="200" visibility="visible">000<tspan class="unit" dx="8">%</tspan><set attributeName="visibility" to="hidden" begin="0.85s"/></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.85s"/><set attributeName="visibility" to="hidden" begin="1.05s"/>020<tspan class="unit" dx="8">%</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.05s"/><set attributeName="visibility" to="hidden" begin="1.25s"/>060<tspan class="unit" dx="8">%</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.25s"/><set attributeName="visibility" to="hidden" begin="1.45s"/>090<tspan class="unit" dx="8">%</tspan></text>
      <text x="0" y="200" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.45s"/>100<tspan class="unit" dx="8">%</tspan></text>
    </g>
    <text x="0" y="250" class="label">LOCAL FIRST</text>
  </g>
</svg>
